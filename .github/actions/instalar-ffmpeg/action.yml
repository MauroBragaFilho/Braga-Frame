name: Instalar FFmpeg
description: >
  Põe um FFmpeg de verdade (compilação GPL do BtbN) no PATH de um runner Windows. Não usa o atalho do Chocolatey: matar o atalho
  deixa o ffmpeg real rodando e os testes de cancelamento esperam minutos. Os testes e o teste do instalador precisam dele.
runs:
  using: composite
  steps:
    - name: Baixar e pôr no PATH
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
        Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
        $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Directory | Select-Object -First 1).FullName + '\bin'
        Add-Content $env:GITHUB_PATH $bin
        & "$bin\ffmpeg.exe" -version | Select-Object -First 1
