name: Release

# Compila o instalador do Windows e publica a Release quando uma TAG de versão é enviada:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# A versão do app e do instalador é a da tag (sem o "v"): o package.json não precisa mudar.
# Reenviar a mesma tag (git push --force origin v0.2.0) refaz a Release e troca o arquivo.
# Pushes na main NÃO publicam nada (só o CI roda).
#
# A Release tem UM arquivo, o instalador, no padrão  braga-frame-<versão>-windows-x64-setup.exe  (versão, sistema e arquitetura no nome).
# Não há arquivo de somas à parte: o GitHub mostra o SHA-256 de cada arquivo ao lado dele, e o texto da Release o repete.
#
# Assinatura digital (SignPath Foundation, gratuita para código aberto; passo a passo em docs/assinatura-signpath.md): liga SOZINHA quando a
# variável do repositório SIGNPATH_ORGANIZATION_ID existe. Sem ela o instalador sai sem assinatura, como a v0.1.0, e o log avisa. Com ela: o instalador
# sobe como artefato (a SignPath o lê), é assinado depois de uma APROVAÇÃO MANUAL no portal da SignPath, a assinatura é conferida e o arquivo ASSINADO é
# o que vai para a Release (o SHA-256 do texto é o do arquivo assinado).
#
# Sem lixo no GitHub:
#   - nenhum artefato do Actions (o instalador vai direto do disco do runner para a Release; só com a assinatura ligada ele sobe, por 1 dia, para a
#     SignPath ler, e é apagado logo depois da assinatura);
#   - nenhum cache do Actions (a instalação das dependências é refeita a cada release: custa uns minutos, não ocupa espaço);
#   - a Release só é criada DEPOIS que lint, testes e a compilação passaram; se o envio falhar no meio, o rascunho é apagado.
# Os registros de execução (logs) ficam pelo prazo do repositório: dá para encurtar em Settings -> Actions -> General.
#
# Pré-requisito: nada além do repositório. A Release é criada com o GITHUB_TOKEN do próprio workflow (contents: write só neste job).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Uma Release por vez: tags seguidas entram em fila.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 360 # o máximo dos runners hospedados: com a assinatura ligada, a espera pela aprovação manual cabe aqui
    permissions:
      contents: write
      actions: write # só para apagar o artefato do instalador sem assinatura depois da assinatura
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # histórico completo: confere que a tag é da main e monta a lista de mudanças

      - name: Conferir a tag (vX.Y.Z e commit da main)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O commit da tag $GITHUB_REF_NAME não está na main. Só se publica o que está na main."
            exit 1
          fi
          echo "Versão da Release: $VERSION (commit $(git rev-parse --short HEAD))"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # sem `cache:` de propósito (veja o topo do arquivo)

      - uses: ./.github/actions/instalar-ffmpeg

      - run: npm ci

      # só publica o que passa nas mesmas verificações do CI
      - name: Lint e testes
        run: |
          npm run lint
          npm test

      - name: Aplicar a versão da tag no build (sem commit)
        run: npm version "$env:VERSION" --no-git-tag-version --allow-same-version

      # Os downloads do Electron e do NSIS falham de vez em quando nos runners: até 3 tentativas.
      - name: Compilar o instalador
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # o electron-builder não assina: quem assina é a SignPath, nos passos abaixo
        run: |
          $code = 1
          for ($try = 1; $try -le 3; $try++) {
            Write-Host "== electron-builder: tentativa $try/3 =="
            npx electron-builder --win nsis --x64 --publish never
            $code = $LASTEXITCODE
            if ($code -eq 0) { break }
            if ($try -lt 3) { Start-Sleep -Seconds 20 }
          }
          if ($code -ne 0) { Write-Error "electron-builder falhou após 3 tentativas (código $code)."; exit $code }

      # ---- Assinatura digital (SignPath Foundation): só roda com a variável SIGNPATH_ORGANIZATION_ID configurada ----
      - name: Assinatura desligada (sem SIGNPATH_ORGANIZATION_ID)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: bash
        run: |
          echo "::warning::SIGNPATH_ORGANIZATION_ID não está configurada: o instalador sai SEM assinatura digital (docs/assinatura-signpath.md)."

      # A SignPath lê o instalador de um artefato do Actions, com nome fixo (a configuração do artefato no portal o espera: .signpath/artifact-configuration.xml).
      - name: Preparar o instalador para a assinatura
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item "dist/installer/braga-frame-$env:VERSION-windows-x64-setup.exe" "unsigned/braga-frame-setup.exe"

      - name: Enviar o instalador sem assinatura (só a SignPath o lê; apagado logo depois)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-unsigned
          path: unsigned/braga-frame-setup.exe
          retention-days: 1 # o mínimo; o passo "Apagar o artefato" o remove antes disso

      - name: Assinar na SignPath (espera a aprovação manual e baixa o assinado)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'braga-frame' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000 # 5 h para você aprovar; passando disso o workflow falha e nada é publicado
          output-artifact-directory: signed

      # Só segue se a assinatura for VÁLIDA; o instalador assinado substitui o sem assinatura (é ele que vai para a Release).
      - name: Conferir a assinatura e usar o instalador assinado
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signed = Join-Path $PWD 'signed/braga-frame-setup.exe'
          if (-not (Test-Path $signed)) { Write-Error "Instalador assinado não encontrado em signed/."; exit 1 }
          $sig = Get-AuthenticodeSignature $signed
          Write-Host "Assinatura: $($sig.Status) | $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Assinatura inválida: $($sig.Status)"; exit 1 }
          Copy-Item $signed "dist/installer/braga-frame-$env:VERSION-windows-x64-setup.exe" -Force

      # Cria a Release com o instalador. Reenvio da mesma tag: apaga a Release anterior (a tag fica) e refaz.
      - name: Publicar a Release
        shell: bash
        env:
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          EXE="dist/installer/braga-frame-${VERSION}-windows-x64-setup.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::Instalador esperado não encontrado: $EXE"
            ls -la dist/installer || true
            exit 1
          fi
          # o instalador é o único .exe da pasta
          [ "$(ls dist/installer/*.exe | wc -l)" = "1" ] || { echo "::error::Há mais de um .exe em dist/installer."; exit 1; }

          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "Instalador para Windows 10 e 11 (64 bits). Instala só para o seu usuário, sem administrador, e **seus projetos são mantidos** ao atualizar."
            echo
            echo "O Braga Frame precisa do FFmpeg para abrir e exportar vídeos; o guia do usuário explica como instalar."
            echo
            if [ "$SIGNED" = "true" ]; then echo "Instalador assinado digitalmente (certificado da SignPath Foundation)."; echo; fi
            echo "SHA-256: \`$SHA\`"
            echo
            echo "## Mudanças"
            if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME"; else git log --no-merges --pretty='- %s' -n 20 "$GITHUB_REF_NAME"; fi
          } > "$RUNNER_TEMP/notas.md"
          cat "$RUNNER_TEMP/notas.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME já existe: apagando para refazer (a tag fica)."
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "$EXE" --verify-tag --title "Braga Frame $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notas.md"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'

      # Sem lixo: o artefato do instalador sem assinatura (só existe com a assinatura ligada) sai daqui, dê certo ou errado.
      - name: Apagar o artefato do instalador sem assinatura
        if: ${{ always() && steps.upload-unsigned.outputs.artifact-id != '' }}
        shell: bash
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.upload-unsigned.outputs.artifact-id }}" || echo "(não consegui apagar o artefato; ele expira em 1 dia)"

      # O `gh` cria a Release em rascunho, envia o arquivo e só então a publica; se algo cair no meio, não deixa um rascunho para trás.
      - name: Se falhou, não deixar Release pela metade
        if: ${{ failure() }}
        shell: bash
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
            echo "Rascunho da Release $GITHUB_REF_NAME apagado."
          fi
